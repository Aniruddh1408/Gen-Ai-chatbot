<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuboCare | Intelligent Healthcare Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            background-image:
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-container {
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            padding: 20px 32px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
        }

        #chat-history {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        #chat-history::-webkit-scrollbar {
            width: 6px;
        }

        #chat-history::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }

        .message {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 0.95rem;
            position: relative;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .input-area {
            padding: 24px 32px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 16px;
            background: rgba(15, 23, 42, 0.3);
        }

        #user-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 20px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        #user-input:focus {
            border-color: var(--accent-primary);
            background: rgba(15, 23, 42, 0.7);
        }

        button {
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 28px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .typing {
            display: none;
            padding: 12px 32px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        .loader-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            color: var(--accent-primary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            display: inline-block;
            animation: dotBounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes dotBounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1.0);
            }
        }

        .insight-box {
            margin-top: 12px;
            padding: 10px;
            background: rgba(56, 189, 248, 0.1);
            border-left: 3px solid var(--accent-primary);
            border-radius: 4px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <header>
            <div class="brand">
                <h1>KuboCare AI</h1>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                Connected to local DB
            </div>
        </header>

        <div id="chat-history">
            <div class="message ai">
                <span class="message-meta">System</span>
                Welcome back! I'm ready to analyze your resident data and Iot hardware. How can I assist?
            </div>
        </div>

        <div id="typing-indicator" class="typing">
            <div class="loader-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <span>Analyzing clinical data...</span>
            </div>
        </div>

        <form class="input-area" id="chat-form">
            <input type="text" id="user-input" placeholder="Ask about residents, health scores, or device alerts..."
                autocomplete="off">
            <button type="submit" id="send-btn">Send</button>
            <button type="button" id="cancel-btn" style="display: none; background: #ef4444;">Cancel</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatHistory = document.getElementById('chat-history');
        const typingIndicator = document.getElementById('typing-indicator');
        const sendBtn = document.getElementById('send-btn');
        const cancelBtn = document.getElementById('cancel-btn');

        // Session handling
        let sessionId = localStorage.getItem('kubo_session_id') || 'session_' + Date.now();
        localStorage.setItem('kubo_session_id', sessionId);

        let currentAbortController = null;

        function addMessage(role, text, isError = false, chartData = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            if (isError) msgDiv.style.borderColor = '#ef4444';

            const meta = role === 'user' ? 'You' : 'Kubo Analyst';
            // Convert markdown formatting logic manually for bullets if present
            let formattedText = text.replace(/\n\* /g, '<br>• ');
            msgDiv.innerHTML = `<span class="message-meta">${meta}</span>${formattedText}`;

            if (chartData && role === 'ai') {
                const chartWrapper = document.createElement('div');
                chartWrapper.style.marginTop = '15px';
                chartWrapper.style.height = '300px';
                chartWrapper.style.position = 'relative';
                chartWrapper.style.backgroundColor = 'rgba(15, 23, 42, 0.4)';
                chartWrapper.style.borderRadius = '12px';
                chartWrapper.style.padding = '15px';
                chartWrapper.style.border = '1px solid rgba(255,255,255,0.05)';

                const canvas = document.createElement('canvas');
                chartWrapper.appendChild(canvas);
                msgDiv.appendChild(chartWrapper);

                const controls = document.createElement('div');
                controls.style.display = 'flex';
                controls.style.gap = '8px';
                controls.style.marginTop = '8px';

                const downloadBtn = document.createElement('button');
                downloadBtn.innerText = '⬇ Download';
                downloadBtn.style.padding = '4px 10px';
                downloadBtn.style.fontSize = '0.75rem';
                downloadBtn.style.background = 'rgba(56, 189, 248, 0.2)';

                const colorBtn = document.createElement('button');
                colorBtn.innerText = '🎨 Change Color';
                colorBtn.style.padding = '4px 10px';
                colorBtn.style.fontSize = '0.75rem';
                colorBtn.style.background = 'rgba(129, 140, 248, 0.2)';

                controls.appendChild(downloadBtn);
                controls.appendChild(colorBtn);
                msgDiv.appendChild(controls);

                Chart.defaults.color = '#f1f5f9';
                const chart = new Chart(canvas.getContext('2d'), chartData);

                downloadBtn.onclick = () => {
                    const link = document.createElement('a');
                    link.download = `kubocare_report_${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                };

                const palettes = [
                    ['#38bdf8', '#818cf8', '#4ade80', '#fbbf24', '#f87171'],
                    ['#ec4899', '#f43f5e', '#f97316', '#eab308', '#84cc16'],
                    ['#06b6d4', '#3b82f6', '#6366f1', '#a855f7', '#d946ef']
                ];
                let pIdx = 0;
                colorBtn.onclick = () => {
                    pIdx = (pIdx + 1) % palettes.length;
                    chart.data.datasets[0].backgroundColor = palettes[pIdx];
                    chart.update();
                };
            }

            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        cancelBtn.addEventListener('click', () => {
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
                typingIndicator.style.display = 'none';
                sendBtn.style.display = 'block';
                cancelBtn.style.display = 'none';
                addMessage('ai', "Analysis cancelled by user.", true);
            }
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = userInput.value.trim();
            if (!query) return;

            userInput.value = '';
            addMessage('user', query);

            // UI State: Loading
            typingIndicator.style.display = 'block';
            sendBtn.style.display = 'none';
            cancelBtn.style.display = 'block';

            currentAbortController = new AbortController();

            try {
                const response = await fetch('http://localhost:8000/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, session_id: sessionId }),
                    signal: currentAbortController.signal
                });

                const data = await response.json();

                // UI State: Back to normal
                typingIndicator.style.display = 'none';
                sendBtn.style.display = 'block';
                cancelBtn.style.display = 'none';
                currentAbortController = null;

                if (data.error) {
                    addMessage('ai', "Error: " + data.error, true);
                } else {
                    addMessage('ai', data.answer, false, data.chart_data);
                    console.log("Trace ID:", data.trace_id);
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    console.log('Fetch aborted');
                } else {
                    typingIndicator.style.display = 'none';
                    sendBtn.style.display = 'block';
                    cancelBtn.style.display = 'none';
                    addMessage('ai', "Connection failed. Please ensure the FastAPI server is running.", true);
                }
                currentAbortController = null;
            }
        });
    </script>
</body>

</html>
